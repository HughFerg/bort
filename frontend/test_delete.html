<!DOCTYPE html>
<html><head><title>Delete Test</title>
<link rel="stylesheet" href="/static/styles.css?v=19">
<style>
body { display: block !important; padding: 20px; }
#testlog { white-space: pre; font-family: monospace; font-size: 14px; background: #000; color: #0f0; padding: 20px; border-radius: 8px; margin: 20px 0; max-height: 500px; overflow-y: auto; }
.test-btn { margin: 5px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<h2 style="color:var(--yellow)">Bulk Delete Test Page</h2>
<p>This page tests the select + delete flow against the real app.js</p>

<div>
    <button class="test-btn" onclick="runFullTest()">Run Full Test</button>
    <button class="test-btn" onclick="document.getElementById('testlog').textContent=''">Clear Log</button>
</div>

<div id="testlog"></div>

<!-- The actual app elements that app.js expects -->
<div class="stats" id="stats"></div>
<div class="search-container"><div class="search-box"><input id="query" value="homer"><button id="searchBtn" onclick="search()">Go!</button></div></div>
<div id="seasonFilters"></div>
<div id="activeFiltersContainer"></div>
<p class="subtitle" id="subtitle"></p>

<div id="results" style="margin: 20px 0;"></div>

<button class="select-fab" id="selectFab" onclick="toggleSelectMode()">Select</button>
<div class="bulk-actions" id="bulkActions">
    <span id="bulkCount">0 selected</span>
    <button class="bulk-delete-btn" onclick="bulkDelete()">Delete Selected</button>
    <button class="bulk-clear-btn" onclick="clearSelection()">Clear</button>
    <button class="bulk-done-btn" onclick="toggleSelectMode()">Done</button>
</div>

<div class="modal" id="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">x</button>
        <img id="modalImage" src="" alt="">
        <div class="modal-info" id="modalInfo">
            <div class="modal-meta">
                <span class="modal-episode" id="modalEpisode"></span>
                <span class="modal-time" id="modalTime"></span>
            </div>
            <div class="modal-path" id="modalPath"></div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>
</div>

<script>
function tlog(msg) {
    var el = document.getElementById('testlog');
    el.textContent += msg + '\n';
    el.scrollTop = el.scrollHeight;
    console.log('[TEST]', msg);
}

// Intercept errors
window.onerror = function(msg, url, line, col, err) {
    tlog('ERROR: ' + msg + ' at line ' + line);
};
</script>

<!-- Load the REAL app.js -->
<script src="/static/app.js?v=18"></script>

<script>
async function runFullTest() {
    tlog('=== FULL DELETE TEST ===');
    tlog('');
    
    // Step 1: Search
    tlog('Step 1: Searching for "homer"...');
    document.getElementById('query').value = 'homer';
    await search();
    
    await new Promise(r => setTimeout(r, 1000));
    
    var cardCount = document.querySelectorAll('.result').length;
    tlog('  Cards rendered: ' + cardCount);
    
    if (cardCount === 0) {
        tlog('FAIL: No cards rendered!');
        return;
    }
    
    // Step 2: Check a card's data attributes
    var card = document.querySelector('.result');
    tlog('  First card dataset:');
    for (var key in card.dataset) {
        tlog('    ' + key + ' = ' + card.dataset[key]);
    }
    
    // Step 3: Toggle select mode
    tlog('');
    tlog('Step 2: Entering select mode...');
    tlog('  selectMode before: ' + selectMode);
    toggleSelectMode();
    tlog('  selectMode after: ' + selectMode);
    tlog('  body.select-mode: ' + document.body.classList.contains('select-mode'));
    
    // Step 4: Click on first card
    tlog('');
    tlog('Step 3: Clicking first card...');
    card.click();
    
    await new Promise(r => setTimeout(r, 200));
    
    tlog('  selectedFrames.size: ' + selectedFrames.size);
    tlog('  selectedFrames: ' + JSON.stringify(Array.from(selectedFrames)));
    tlog('  card.classList: ' + card.className);
    
    // Step 5: Click second card
    var card2 = document.querySelectorAll('.result')[1];
    if (card2) {
        tlog('');
        tlog('Step 4: Clicking second card...');
        card2.click();
        await new Promise(r => setTimeout(r, 200));
        tlog('  selectedFrames.size: ' + selectedFrames.size);
    }
    
    // Step 6: Try bulk delete
    tlog('');
    tlog('Step 5: Testing bulkDelete...');
    tlog('  selectedFrames.size before delete: ' + selectedFrames.size);
    
    if (selectedFrames.size === 0) {
        tlog('FAIL: selectedFrames is EMPTY - clicks did not register!');
        tlog('');
        tlog('Debugging: manually adding to selectedFrames and trying again...');
        var testPath = document.querySelector('.result').dataset.path;
        selectedFrames.add(testPath);
        tlog('  Manually added: ' + testPath);
        tlog('  selectedFrames.size now: ' + selectedFrames.size);
    }
    
    // Override confirm for test
    var origConfirm = window.confirm;
    window.confirm = function() { tlog('  confirm() called - returning true'); return true; };
    
    await bulkDelete();
    
    window.confirm = origConfirm;
    
    tlog('');
    tlog('Step 6: After delete...');
    tlog('  selectedFrames.size: ' + selectedFrames.size);
    tlog('  Cards remaining: ' + document.querySelectorAll('.result').length);
    
    tlog('');
    tlog('=== TEST COMPLETE ===');
}
</script>
</body></html>
